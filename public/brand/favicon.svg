<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>CNI AI &amp; Digital Division</title>
  <!--
    Favicon — a deliberately simplified reduction of the full mark.
    At 16px the 30-facet mesh becomes mud, so this keeps only what survives:
    the low-poly silhouette, the teal/gold split, and three dissolving pixels.
    Hex values are hardcoded because a favicon cannot read the page's CSS
    variables. They mirror --teal-700 and --gold-500 in styles/tokens.css.
  -->
  <defs>
    <clipPath id="brain">
      <path d="M10 32 L13 19 L24 11 L38 9 L49 15 L53 27 L50 39 L41 48 L33 51 L31 61 L26 50 L15 43 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#brain)">
    <rect x="0" y="0" width="31" height="64" fill="#0E5C63" />
    <rect x="31" y="0" width="33" height="64" fill="#D4A63C" />

    <!-- Facet seams. Fade out below ~24px, which is intended. -->
    <g stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" fill="none" opacity="0.92">
      <path d="M10 32 L26 24 L24 11" />
      <path d="M26 24 L38 9" />
      <path d="M26 24 L31 40 L15 43" />
      <path d="M31 40 L41 48" />
      <path d="M26 24 L43 22 L49 15" />
      <path d="M43 22 L53 27" />
      <path d="M43 22 L31 40" />
      <path d="M43 22 L50 39" />
    </g>
  </g>

  <!-- The dissolve -->
  <rect x="55" y="20" width="6" height="6" rx="0.5" fill="#D4A63C" opacity="0.95" />
  <rect x="56" y="33" width="5" height="5" rx="0.5" fill="#0E5C63" opacity="0.8" />
  <rect x="58" y="44" width="4" height="4" rx="0.5" fill="#D4A63C" opacity="0.6" />
</svg>
